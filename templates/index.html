<!DOCTYPE html>
<html>
<head>
  <title>{{ title }}</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; }
    li { margin: 8px 0; }
    .done { text-decoration: line-through; color: gray; }
    form.inline { display: inline; }
  </style>
</head>
<body>
  <h1>{{ title }}</h1>
  <form action="/add" method="post">
    <input name="task" placeholder="New task" required>
    <button type="submit">Add</button>
  </form>
  <ul>
    {% for t in tasks %}
    <li>
      <span class="{{ 'done' if t.done else '' }}">{{ t.text }}</span>
      <form class="inline" action="/toggle/{{ t.id }}" method="post"><button>✓</button></form>
      <form class="inline" action="/delete/{{ t.id }}" method="post"><button>✗</button></form>
    </li>
    {% endfor %}
  </ul>
</body>
</html>
